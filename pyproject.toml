[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# Poetry: install dependencies only (no importable top-level package named like the project).
[tool.poetry]
package-mode = false

[project]
name = "SIGINT-RF-GUI"
version = "0.1.0"
description = "SIGINT RF Shiny GUI for SMW200A ARB catalog; uses SIGINT-RF-DEVICE-VSG_SMW200A for instruments and SCPI/TCP."
requires-python = ">=3.14.5"
readme = "README.md"
license = { text = "MIT" }
keywords = ["smw200a", "vsg", "scpi", "rohde-schwarz", "sigint", "arb"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

# Device package (git) supplies vsg_smw200a, smw200a_arb_signals, rs_scpi_tcp, Tk smoke (sigint-rf-vsg-tk).
dependencies = [
    "numpy>=1.24",
    "RsSmw>=5.0.44",
    "PyYAML>=6.0.1",
    "SIGINT-RF-DEVICE-VSG_SMW200A @ git+https://github.com/carlos-masia/SIGINT-RF-DEVICE-VSG_SMW200A.git@v0.1.0",
    "shiny ==1.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4",
    "pytest-cov==4.1",
    "black>=24.0",
    "ruff==0.4",
    "mypy==1.5",
]

[project.scripts]
sigint-rf-gui-shiny = "vsg_gui:main"

[tool.setuptools]
py-modules = ["vsg_gui"]

[tool.setuptools.package-dir]
"" = "SIGINT-RF-GUI"

[tool.black]
line-length = 100
target-version = ["py314"]
[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true

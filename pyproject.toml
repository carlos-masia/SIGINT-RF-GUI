[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# Poetry: install dependencies only (no importable top-level package named like the project).
[tool.poetry]
package-mode = false

[project]
name = "SIGINT-RF-GUI"
version = "0.1.0"
description = "SIGINT RF Shiny GUI for SMW200A ARB catalog; uses SIGINT-RF-DEVICE-VSG_SMW200A for instruments and SCPI/TCP."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
keywords = ["smw200a", "vsg", "scpi", "rohde-schwarz", "sigint", "arb"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

# Device package (git) supplies vsg_smw200a, rs_scpi_tcp, Tk smoke (sigint-rf-vsg-tk).
dependencies = [
    "numpy==2.4.6",
    "RsSmw==5.50.42",
    "SIGINT-RF-DEVICE-VSG_SMW200A @ git+https://github.com/carlos-masia/SIGINT-RF-DEVICE-VSG_SMW200A.git@v0.1.3",
    "shiny==1.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4",
    "pytest-cov==4.1",
    "black>=24.0",
    "ruff==0.4",
    "mypy==1.5",
]

[project.scripts]
sigint-rf-gui-shiny = "vsg_gui:main"

[tool.setuptools]
py-modules = ["vsg_gui"]

[tool.setuptools.package-dir]
"" = "SIGINT-RF-GUI"

[tool.black]
line-length = 100
target-version = ["py312"]
[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
